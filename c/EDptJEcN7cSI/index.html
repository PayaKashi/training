:root{--bg:#121014;--card:#1D1A20;--line:rgba(255,255,255,.08);--fg:#F1ECEF;--muted:#A39BA6;--pink:#E05A9C;--pink2:#F08CC2;--soft:rgba(224,90,156,.16);--green:#9FE0B8;--amber:#F0B86E;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
html.large{font-size:17.5px}
html,body{margin:0;background:radial-gradient(70% 35% at 0% 0%,rgba(120,40,80,.22),transparent 70%),radial-gradient(60% 40% at 100% 90%,rgba(110,60,200,.10),transparent 70%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 120px;overflow-x:clip}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top small{display:block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.top h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:1.85rem;letter-spacing:-.01em;line-height:1.15}
.top h1 b{font-weight:400;color:var(--pink2)}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#1b181d var(--logo-s) center/cover;box-shadow:0 0 0 1.5px rgba(240,140,194,.7),0 6px 18px rgba(224,90,156,.3)}
h2.page{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:2rem;margin:4px 2px 16px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 14px 30px -20px rgba(0,0,0,.8)}
.card.glow{background:radial-gradient(90% 80% at 100% 0%,rgba(224,90,156,.28),transparent 60%),var(--card);border-color:rgba(224,90,156,.35)}
.card.hot{background:linear-gradient(160deg,#F27BC0,#C2478A 70%);border:0;box-shadow:0 22px 40px -22px rgba(224,72,150,.85)}
.card.hot .lab,.card.hot .sub{color:rgba(255,255,255,.85)}
.card.hot .big{color:#fff}
.lab{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.lab.pk{color:var(--pink2)}
.big{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:2rem;line-height:1.12;margin:8px 0 2px;letter-spacing:-.01em}
.big em{font-style:normal;color:var(--pink2)}
.sub{color:var(--muted);font-size:.95rem;margin:3px 0 0}
.btn{display:block;width:100%;border:0;cursor:pointer;margin-top:14px;padding:13px;border-radius:16px;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(120deg,#EC74B0,#D04A8E 60%,#B23A77);box-shadow:0 10px 24px -10px rgba(224,90,156,.8);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:#121014;box-shadow:none}
.btn.q{background:rgba(255,255,255,.07);box-shadow:none;color:var(--fg)}
.btn.line{background:transparent;border:1px solid rgba(255,255,255,.16);box-shadow:none;color:var(--fg)}
.sec{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec a{letter-spacing:0;text-transform:none;font-size:.9rem;color:var(--pink2);font-weight:600;text-decoration:none;cursor:pointer}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.li:first-child{border-top:0}
.li:active{background:rgba(255,255,255,.03)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:1rem;font-weight:600}.li .t span{display:block;font-size:.87rem;color:var(--muted);margin-top:1px}
.li .r{text-align:right;font-weight:700;white-space:nowrap}
.li .r.plus{color:var(--pink2)}
.chev{color:var(--muted);flex:none;width:18px;height:18px}
.date{width:46px;height:46px;border-radius:13px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.date small{font-size:.66rem;font-weight:800;color:var(--pink2);letter-spacing:.06em}.date b{font-size:1.15rem;color:var(--pink2);margin-top:2px}
.date.past{background:rgba(255,255,255,.06)}.date.past small,.date.past b{color:var(--fg)}

<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Training">
<meta name="theme-color" content="#F2F5F3">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>My Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm phone column, big type, three tabs pinned to the bottom. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --line:#DCE4E0; --fg:#16201D; --muted:#4F5D58;
  --accent:#1E6B66; --accent-ink:#FFFFFF; --accent-soft:#E0EEEB; --accent-strong:#154F4B;
  --warn-bg:#FBEFD9; --warn-fg:#77470A; --scrim:rgba(14,22,20,.45);
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211E; --line:#2A3632; --fg:#E7EEEA; --muted:#A6B4AE;
  --accent:#62B9AF; --accent-ink:#0A1D1A; --accent-soft:#1C3431; --accent-strong:#8ED3CA;
  --warn-bg:#3A2B12; --warn-fg:#F3CA7E; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --line:#2A3632; --fg:#E7EEEA; --muted:#A6B4AE;
  --accent:#62B9AF; --accent-ink:#0A1D1A; --accent-soft:#1C3431; --accent-strong:#8ED3CA;
  --warn-bg:#3A2B12; --warn-fg:#F3CA7E; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{font-size:16px}
html.large{font-size:19px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.0625rem;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{max-width:480px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px calc(110px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:20px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:16px}
.top p{margin:0;color:var(--muted);font-size:1rem}
.top h1{margin:2px 0 0;font-size:1.875rem;font-weight:800;line-height:1.15;text-wrap:balance}
.size-btn{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.size-btn small{font-size:.75rem;font-weight:600;color:var(--muted)}

.view{display:flex;flex-direction:column;gap:20px}
.label{margin:0;font-size:.8125rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h2.section{margin:0;font-size:1.25rem;font-weight:800}
h2.page{margin:0;font-size:1.625rem;font-weight:800}
.row-head{display:flex;justify-content:space-between;align-items:center}
.link-btn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--accent);font-weight:700;cursor:pointer;font-size:1rem}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:inherit;opacity:.85}
.hero .when{margin:0;font-size:2.25rem;font-weight:800;line-height:1.05}
.hero .sub{margin:4px 0 0;font-size:1.25rem;font-weight:600}
.hero .kind{display:inline-flex;align-items:center;gap:8px;font-size:1.0625rem}
.hero.empty{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.hero.empty .when{font-size:1.5rem}
.btn{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:1.0625rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn-on-accent{background:var(--accent-ink);color:var(--accent)}
.btn-quiet{background:var(--accent-soft);color:var(--accent-strong)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.big{margin:0;font-size:3rem;font-weight:800;line-height:1;color:var(--accent)}
.big.owe{color:var(--fg)}
.muted{color:var(--muted);margin:0}
.paid-line{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--accent-strong);margin:0}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.0625rem;color:var(--accent-strong);letter-spacing:.01em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1.125rem}
.cover-line{margin:0;font-weight:600;color:var(--fg)}
.cover-line.warn{color:var(--warn-fg)}
.btn-line{background:var(--surface);color:var(--accent-strong);border:1.5px solid var(--accent-soft)}
.lift{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.lift:hover{border-color:var(--accent)}
.lift-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.lift-main strong{font-size:1.0625rem}
.lift-main .best{font-size:1.25rem;font-weight:800;color:var(--accent)}
.lift-main .s{color:var(--muted);font-size:.9375rem}
.spark{flex:0 0 76px;height:32px;color:var(--accent)}
.chart{width:100%;height:auto;display:block;color:var(--accent)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line)}
.pr{display:inline-block;font-size:.75rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.slot{height:10px;border-radius:5px;background:var(--line)}
.slot.ok{background:var(--accent)}
.slot.part{background:linear-gradient(90deg,var(--accent) 0 38%,var(--line) 38% 100%)}
.slot-key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:.8125rem;color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:14px;padding:14px 16px}
.notice p{margin:0;font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.sess{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.sess:hover{border-color:var(--accent)}
.tile{flex:0 0 58px;height:58px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tile b{font-size:1.375rem}
.tile span{font-size:.75rem;font-weight:700;letter-spacing:.06em}
.sess-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.sess-main strong{font-size:1.125rem}
.sess-main span{color:var(--muted);font-size:1rem}
.chip{flex:0 0 auto;font-size:.8125rem;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent-strong)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.group-label{margin:8px 0 0}
.empty-note{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted);margin:0}

.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rate{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.rate b{font-size:1.375rem}
.rate span{font-size:.9375rem;color:var(--muted)}

.timeline{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tl-row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.dot{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-strong)}
.dot.pay{background:var(--accent);color:var(--accent-ink)}
.tl-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.tl-top{display:flex;justify-content:space-between;gap:10px}
.tl-top strong{font-size:1.0625rem}
.tl-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.amt{font-weight:700;white-space:nowrap}
.amt.plus{color:var(--accent)}
.tl-main span.s{color:var(--muted);font-size:.9375rem}
.grp{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.grp:hover{border-color:var(--accent)}
.grp.owing{background:var(--warn-bg);border-color:transparent;color:var(--warn-fg)}
.grp.owing .s{color:var(--warn-fg)}
.grp .chev{flex:0 0 auto;color:var(--muted)}
.dot.warn{background:var(--surface);color:var(--warn-fg)}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.fold summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;padding:8px 18px;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary .chev{color:var(--muted);transition:transform .2s}
.fold[open] summary .chev{transform:rotate(180deg)}
.fold-body{padding:0 12px 8px;display:flex;flex-direction:column;gap:6px}
.total-row{display:flex;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--line);font-weight:800;background:var(--bg)}

.footer-note{color:var(--muted);font-size:.9375rem;margin:0;text-align:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));z-index:5}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-top:6px;padding-bottom:10px}
nav.tabs .inner.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.875rem;font-weight:600;cursor:pointer;border-radius:12px}
.tab[aria-current="page"]{color:var(--accent);font-weight:800}
.tab[aria-current="page"] svg{stroke-width:2.4}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:12px max(20px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow-y:auto}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:88dvh}
.sheet > *{flex-shrink:0}
html.sheet-open,html.sheet-open body{overflow:hidden}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:1.5rem;font-weight:800;line-height:1.2}
.facts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact span{color:var(--muted)}
.fact b{text-align:right}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

</head>
<body>
<div class="app">
  <span id="client" data-name="" hidden></span>
  <header class="top">
    <div>
      <p id="today-line"></p>
      <h1 id="greeting">Hi </h1>
    </div>
  </header>

  <main id="view" class="view"><p class="empty-note">Loading your account…</p></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="inner">
    <button class="tab" type="button" data-tab="home">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button class="tab" type="button" data-tab="upcoming">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      Upcoming
    </button>
    <button class="tab" type="button" data-tab="progress" id="tab-progress" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      Progress
    </button>
    <button class="tab" type="button" data-tab="account">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      My account
    </button>
  </div>
</nav>

<div id="sheet-root"></div>

<script>
(function(){
  // Reads this client's own data.json (rebuilt every night from Paya's payments tracker and Clients calendar).
  var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function torontoParts(){
    var f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false });
    var p = {}; f.formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return { key: p.year + '-' + p.month + '-' + p.day, hour: +p.hour % 24 };
  }
  var NOW = torontoParts();
  var TODAY_KEY = NOW.key;
  var TODAY = parse(TODAY_KEY);

  // ---- helpers ----
  function parse(s){ var p = s.slice(0,10).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function money(n){ var v = Math.abs(n); return '$' + (v % 1 ? v.toFixed(2) : v.toLocaleString('en-US')); }
  function wd(d){ return d.toLocaleDateString('en-US',{weekday:'long'}); }
  function md(d){ return d.toLocaleDateString('en-US',{month:'short', day:'numeric'}); }
  function full(d){ return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'}); }
  function short(d){ return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}); }
  function dayDiff(d){ return Math.round((d - TODAY) / 86400000); }
  function rel(d){ var n = dayDiff(d); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : wd(d); }
  function clock(t){ var h = +t.slice(0,2), m = t.slice(3); var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return { t: h + ':' + m, ap: ap }; }
  function timeRange(a, b){ if (!a) return ''; if (!b) { var c = clock(a); return c.t + ' ' + c.ap; } var x = clock(a), y = clock(b); return x.ap === y.ap ? x.t + ' – ' + y.t + ' ' + y.ap : x.t + ' ' + x.ap + ' – ' + y.t + ' ' + y.ap; }
  function joinNames(n){ return n.length === 1 ? n[0] : n.slice(0,-1).join(', ') + ' and ' + n[n.length-1]; }
  function kindLabel(s){ return !s.partners.length ? 'One-on-one' : (s.partners.length === 1 ? 'Tandem with ' : 'Group with ') + joinNames(s.partners); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
  function monthOf(d){ return MONTHS_LONG[d.getMonth()]; }

  var icons = {
    check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    one: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>',
    two: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.6c3.2-.4 6 1.4 6 4.9"/></svg>',
    clock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    chevR: '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    cal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>',
    chevD: '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
  };

  // ---- shape the data ----
  function build(data){
    var a = { name: data.name, plan: data.plan, owed: data.owed || 0, credit: data.credit || 0 };
    a.asOf = data.asOf ? md(parse(data.asOf)) : '';
    a.upcoming = (data.upcoming || []).filter(function(s){ return s.date >= TODAY_KEY; }).map(function(s){
      return { d: parse(s.date), key: s.date, start: s.start, end: s.end, partners: s.partners || [], price: s.price };
    });
    var groups = [];
    if (a.plan === 'prepaid') {
      a.rows = (data.ledger || []).map(function(r){
        return r.type === 'session'
          ? { d: parse(r.date), type: 'session', partners: r.partners || [], amt: r.amount, bal: r.balance }
          : { d: parse(r.date), type: 'topup', amt: r.amount, bal: r.balance, method: r.method, note: r.note };
      });
      var bal = a.credit;
      a.upcoming.forEach(function(s){
        var p = s.price || 0;
        s.before = bal; bal -= p; s.after = bal;
        s.status = s.before >= p ? 'covered' : (s.before > 0 ? 'partial' : 'unpaid');
        s.short = s.status === 'partial' ? p - s.before : p;
      });
      a.coveredCount = a.upcoming.filter(function(s){ return s.status === 'covered'; }).length;
      a.mixedRates = a.upcoming.some(function(s){ return s.partners.length; }) && a.upcoming.some(function(s){ return !s.partners.length; });
      a.rows.forEach(function(r){
        if (r.type === 'topup') { groups.push({ kind: 'topup', d: r.d, row: r }); return; }
        var m = monthOf(r.d), g = groups[groups.length - 1];
        if (!g || g.kind !== 'month' || g.month !== m) { g = { kind: 'month', month: m, rows: [] }; groups.push(g); }
        g.rows.push(r); g.d = r.d;
      });
      groups.forEach(function(g){
        if (g.kind !== 'month') return;
        g.total = g.rows.reduce(function(x, r){ return x + r.amt; }, 0);
        g.endBal = g.rows[g.rows.length - 1].bal;
      });
      groups.reverse();
      // Last payment cycle: the latest top-up and every session paid from it (plus sessions it cleared that were owing just before)
      var li = -1; a.rows.forEach(function(r, i){ if (r.type === 'topup') li = i; });
      if (li >= 0) {
        var before = [];
        for (var j = li - 1; j >= 0 && a.rows[j].type === 'session' && a.rows[j].bal < 0; j--) before.unshift(a.rows[j]);
        var cyc = before.concat(a.rows.slice(li + 1));
        a.lastCycle = { row: a.rows[li], rows: cyc, used: cyc.reduce(function(x, r){ return x + r.amt; }, 0) };
      }

      });

        rows.forEach(function(r){ used[r.s.key + r.s.start] = true; });

        var m = monthOf(r.d) + ' ' + r.d.getFullYear();
        var g = groups.find(function(x){ return x.kind === 'paid' && x.mkey === m; });
        if (!g) { g = { kind: 'paid', mkey: m, month: monthOf(r.d), rows: [] }; groups.push(g); }
        g.rows.push(r); g.d = r.d;

  // ---- progress (Hevy) ----
  function fmtW(w){ return (Math.round(w * 2) / 2).toString(); }
  // A lift is "weighted" if any session used weight; assisted lifts count less assistance as progress.
  function setText(p, unit, l){ return p.weight ? fmtW(p.weight) + ' ' + unit + (l && l.assisted ? ' assist' : '') + ' × ' + p.reps : (l && l.weighted ? 'Bodyweight × ' : '') + p.reps + (l && l.weighted ? '' : ' reps'); }
  function liftVal(p, l){ return l && l.weighted ? (p.weight || 0) : p.reps; }
  function better(x, y, l){
    if (x.weight !== y.weight) {
      if (l && l.assisted && x.weight && y.weight) return x.weight < y.weight;
      return x.weight > y.weight;
    }
    return x.reps > y.reps;
  }
  function sparkline(lift){
    var v = lift.sessions.map(function(p){ return liftVal(p, lift) * (lift.assisted ? -1 : 1); }); if (v.length < 2) return '';
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), span = hi - lo || 1;
    var pts = v.map(function(x, i){ return (2 + i * 72 / (v.length - 1)).toFixed(1) + ',' + (28 - (x - lo) / span * 24).toFixed(1); }).join(' ');
    return '<svg class="spark" viewBox="0 0 76 32" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function liftSub(lift, unit){
    var s = lift.sessions, first = s[0], best = lift.best;
    if (s.length < 2) return 'First logged ' + md(parse(first.date));
    if (lift.assisted && first.weight && best.weight < first.weight) return fmtW(first.weight - best.weight) + ' ' + unit + ' less help since ' + md(parse(first.date));
    if (lift.weighted && !first.weight && best.weight) return 'Added weight since ' + md(parse(first.date));
    if (first.weight && best.weight > first.weight) return 'Up ' + fmtW(best.weight - first.weight) + ' ' + unit + ' since ' + md(parse(first.date));
    if (!first.weight && best.reps > first.reps) return 'Up ' + (best.reps - first.reps) + ' reps since ' + md(parse(first.date));
    return plural(s.length, 'session') + ' since ' + md(parse(first.date));
  }
  function liftGroup(l){
    if (l.group) return l.group;
    var n = l.name.toLowerCase();
    if (/squat|leg press|lunge|deadlift|\brdl\b|hip|glute|leg curl|leg extension|calf|step[ -]?up|abduct|adduct|back extension|hyperextension|thrust|bridge|good morning|sled|kettlebell swing/.test(n)) return 'Lower body';
    if (/bench|press|row|pull|chin|curl|push[ -]?up|fly|raise|dip|tricep|skull|pushdown|extension|shrug|face pull/.test(n)) return 'Upper body';
    return 'Other';
  }
  function viewProgress(a){
    var p = a.progress;
    if (!p || !p.lifts.length) return '<h2 class="page">Your progress</h2><p class="empty-note">Your lifts will show here after your next workout with Paya.</p>';
    return '<h2 class="page">Your progress</h2>' +
      '<p class="muted">Your best set on each exercise. Tap one to see how it\'s changed over time.</p>' +
      ['Lower body', 'Upper body', 'Other'].map(function(g){
        var items = p.lifts.map(function(l, i){ return { l: l, i: i }; }).filter(function(x){ return liftGroup(x.l) === g; });
        if (!items.length) return '';
        return '<p class="label group-label">' + g + '</p><div class="list">' + items.map(function(x){
          var l = x.l;
          return '<button class="lift" type="button" data-lift="' + x.i + '"><div class="lift-main"><strong>' + esc(l.name) + '</strong>' +
            '<span class="best">' + setText(l.best, p.unit, l) + '</span><span class="s">' + liftSub(l, p.unit) + '</span></div>' + sparkline(l) + icons.chevR + '</button>';
        }).join('') + '</div>';
      }).join('') +
      (p.updated ? '<p class="footer-note">From your workouts with Paya, up to ' + md(parse(p.updated)) + '.</p>' : '');
  }
  function liftChart(lift, unit){
    var s = lift.sessions; if (s.length < 2) return '';
    var W = 320, H = 170, L = 40, R = 12, T = 14, B = 26;
    var v = s.map(function(p){ return liftVal(p, lift); }), lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    var pad = (hi - lo) * 0.15 || Math.max(1, hi * 0.1); var step = hi > 20 ? 5 : 1; lo = Math.max(0, Math.floor((lo - pad) / step) * step); hi = Math.ceil((hi + pad) / step) * step;
    var x = function(i){ return L + i * (W - L - R) / (s.length - 1); };
    var y = function(val){ return T + (H - T - B) * (1 - (val - lo) / (hi - lo)); };
    var ticks = [lo, (lo + hi) / 2, hi].map(function(t){ return Math.round(t); });
    var best = null, out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(lift.name) + ' best set over time">';
    ticks.forEach(function(t){ out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '</text>'; });
    out += '<polyline points="' + s.map(function(p, i){ return x(i).toFixed(1) + ',' + y(liftVal(p, lift)).toFixed(1); }).join(' ') + '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.forEach(function(p, i){
      var isPr = !best || better(p, best, lift); if (isPr) best = p;
      out += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(liftVal(p, lift)).toFixed(1) + '" r="' + (isPr ? 5 : 3.5) + '" fill="' + (isPr ? 'currentColor' : 'var(--surface)') + '" stroke="currentColor" stroke-width="2"/>';
    });
    out += '<text x="' + L + '" y="' + (H - 6) + '">' + md(parse(s[0].date)) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + md(parse(s[s.length - 1].date)) + '</text></svg>';
    return out;
  }
  function liftSheet(a, i){
    var p = a.progress, l = p.lifts[i], best = null;
    var rows = l.sessions.map(function(s){ var pr = !best || better(s, best, l); if (pr) best = s; return { s: s, pr: pr }; }).reverse();
    openSheet('<h3>' + esc(l.name) + '</h3>' +
      '<p class="muted">Best set: <b style="color:var(--fg)">' + setText(l.best, p.unit, l) + '</b> on ' + md(parse(l.best.date)) + '</p>' +
      liftChart(l, p.unit) +
      (l.sessions.length > 1 ? '<p class="muted" style="font-size:.875rem">' + (l.assisted ? 'Assistance on your best set each session (lower is stronger).' : (l.weighted ? 'Weight' : 'Reps') + ' of your best set each session.') + ' Filled dots are new bests.</p>' : '') +
      '<div class="timeline">' + rows.map(function(r){
        return '<div class="tl-row"><div class="tl-main"><div class="tl-top"><strong>' + short(parse(r.s.date)) + '</strong><span class="amt">' + setText(r.s, p.unit, l) + (r.pr ? '<span class="pr">Best</span>' : '') + '</span></div></div></div>';
      }).join('') + '</div>', l.name);
  }

  // ---- state + routing ----
  var acct = null, recentOpen = false;
  document.addEventListener('toggle', function(e){ if (e.target.classList && e.target.classList.contains('fold')) recentOpen = e.target.open; }, true);
  var views = { home: viewHome, upcoming: viewUpcoming, account: viewAccount, progress: viewProgress };
  // Website mode: the link carries this client's private key after the #; tabs are kept in memory instead.
  var SLUG_KEY = 'client-key:' + location.pathname;
  var KEY = (location.hash || '').length > 30 ? location.hash.slice(1) : null;
  if (KEY) { try { localStorage.setItem(SLUG_KEY, KEY); } catch (e) {} }
  else if (!document.getElementById('client').getAttribute('data-name')) { try { KEY = localStorage.getItem(SLUG_KEY); } catch (e) {} }
  var curTab = 'home';
  var CAN_ICS = false; // calendar buttons turned off: view-only app
  function current(){ if (KEY) return curTab; var h = (location.hash || '').slice(1); return views[h] ? h : 'home'; }
  function render(){
    var name = current();
    document.querySelectorAll('.tab').forEach(function(t){
      if (t.dataset.tab === name) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
    });
    document.getElementById('greeting').hidden = name !== 'home';
    document.getElementById('today-line').hidden = name !== 'home';
    if (!acct) return;
    document.getElementById('view').innerHTML = views[name](acct);
  }
  function go(name){ if (KEY) { curTab = name; render(); } else if (location.hash.slice(1) === name) render(); else location.hash = name; window.scrollTo(0, 0); }
  window.addEventListener('hashchange', function(){ if (KEY) return; render(); window.scrollTo(0, 0); });

  document.addEventListener('click', function(e){
    var t = e.target.closest('button, .scrim');
    if (!t) return;
    if (t.classList.contains('scrim') && e.target !== t) return;
    if (t.hasAttribute('data-close')) { closeSheet(); return; }
    if (t.dataset.tab) { go(t.dataset.tab); return; }
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.id === 'retry') { load(); return; }
    if (acct && t.dataset.ics !== undefined) { addToCalendar(t.dataset.ics === 'all' ? acct.upcoming : [acct.upcoming[Number(t.dataset.ics)]]); return; }
    if (acct && t.dataset.lift !== undefined) { liftSheet(acct, Number(t.dataset.lift)); return; }
    if (acct && t.dataset.cycle !== undefined) { cycleSheet(acct); return; }
    if (!acct) return;
    if (t.dataset.sess !== undefined) { sessionSheet(acct, Number(t.dataset.sess)); return; }
    if (t.dataset.group !== undefined) { groupSheet(acct, Number(t.dataset.group)); return; }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheetRoot.innerHTML) closeSheet(); });

  function setLarge(on){
    document.documentElement.classList.toggle('large', on);
    document.getElementById('size-btn').setAttribute('aria-pressed', on ? 'true' : 'false');
    document.getElementById('size-word').textContent = on ? 'Normal' : 'Larger';
    try { localStorage.setItem('client-large-text', on ? '1' : '0'); } catch (e) {}
  }

  function greet(name){
    document.getElementById('greeting').textContent = (NOW.hour < 12 ? 'Good morning' : NOW.hour < 18 ? 'Good afternoon' : 'Good evening') + (name ? ', ' + name : '');
  }
  document.getElementById('today-line').textContent = full(TODAY);
  greet(document.getElementById('client').getAttribute('data-name'));

  function b64u(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function getData(){
    if (!KEY) return fetch('data.json', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
    return Promise.all([
      fetch('data.enc', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }),
      crypto.subtle.importKey('raw', b64u(KEY), 'AES-GCM', false, ['decrypt'])
    ]).then(function(x){
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(x[0].iv) }, x[1], b64u(x[0].ct));
    }).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function load(){
    document.getElementById('view').innerHTML = '<p class="empty-note">Loading your account…</p>';
    getData()
      .then(function(d){
        greet(d.name); acct = build(d);
        var hasP = !!acct.progress;
        document.getElementById('tab-progress').hidden = !hasP;
        document.querySelector('nav.tabs .inner').classList.toggle('four', hasP);
        render();
      })
      .catch(function(){
        document.getElementById('view').innerHTML = '<div class="empty-note"><p style="margin:0 0 12px">Your account didn\'t load. Check your connection and try again. If it keeps happening, ask Paya to resend your link.</p><button class="btn btn-quiet" type="button" id="retry">Try again</button></div>';
      });
  }
  render();
  load();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Training Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column; warm paper surfaces, soft floating cards, one clean sans (Manrope) throughout, ocean-blue accent; bottom tab bar, bottom sheets for input */
:root{
  --bg:#F5F2EC; --surface:#FFFDF9; --sunk:#EDE8DF; --line:#E6DFD3;
  --fg:#1F1C18; --muted:#6F675D; --faint:#A39A8E;
  --accent:#1D5D8C; --accent-ink:#FFFFFF; --accent-soft:#E1EAF1;
  --good:#2F8A5B; --warn:#C7861C; --bad:#C2493D;
  --protein:#1D5D8C; --carbs:#D08A2E; --fat:#8B5FA8;
  --shadow:0 1px 2px rgba(70,52,30,.05),0 8px 24px rgba(70,52,30,.07);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171512; --surface:#211E1A; --sunk:#2B2722; --line:#36312A;
  --fg:#F1ECE4; --muted:#A89F92; --faint:#766E63;
  --accent:#72A9D6; --accent-ink:#0D1A24; --accent-soft:#1F3243;
  --good:#5DBB86; --warn:#E3A947; --bad:#E2705F;
  --protein:#72A9D6; --carbs:#E6A65A; --fat:#B48CD0;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171512; --surface:#211E1A; --sunk:#2B2722; --line:#36312A;
  --fg:#F1ECE4; --muted:#A89F92; --faint:#766E63;
  --accent:#72A9D6; --accent-ink:#0D1A24; --accent-soft:#1F3243;
  --good:#5DBB86; --warn:#E3A947; --bad:#E2705F;
  --protein:#72A9D6; --carbs:#E6A65A; --fat:#B48CD0;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-display);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em;font-weight:600}
.label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.015em;line-height:1.25}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:8px 12px}
.datebox{flex:1;display:flex;align-items:center;gap:2px;min-width:0}
.datebox h1{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:17px;height:17px;stroke:var(--fg);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ghost{border:0;background:none;padding:6px;border-radius:10px;display:grid;place-items:center}
.ghost svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}

/* hero calories */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;align-content:center}
.ring .big{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em}
.macro{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transform-origin:left center}

.recov{display:flex;align-items:center;gap:14px}
.pct{font-size:36px;font-weight:700;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-size:24px;font-weight:700;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--muted)}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--muted)}
.item .kc{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.sport{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.sport svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.warnnote{font-size:13px;border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--fg)}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--faint);position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:50%;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(-50%)}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(60,45,25,.12)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(24,18,10,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(92% - env(safe-area-inset-top,0px));overflow:auto;border-radius:24px 24px 0 0;padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;align-items:center}
.exbox{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);animation:fade .2s}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* motion: screens rise in, rings and bars fill when a tab opens */
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(28px);opacity:.4}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringin{from{stroke-dasharray:0 1000}}
.anim>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(n+6){animation-delay:.25s}
.anim .bar>i{animation:grow 1s cubic-bezier(.2,.7,.2,1) .15s both}
.anim .ring circle+circle{animation:ringin 1.2s cubic-bezier(.2,.7,.2,1) .1s both}
@media (prefers-reduced-motion:reduce){.spin,.anim>*,.anim .bar>i,.anim .ring circle+circle,.sheet,.scrim,.toast{animation:none}}
.res{display:flex;flex-direction:column;gap:8px}
.resitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.resitem .q{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.resitem .q input{width:84px;padding:6px 8px}
.amt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;grid-column:1/-1}
.amt input{width:84px;padding:7px 8px;text-align:center;font-weight:600}
.seg.mini{padding:2px;border-radius:9px}
.seg.mini button{padding:5px 10px;font-size:12.5px;flex:none;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmacs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fmac{display:flex;flex-direction:column;gap:5px;min-width:0}
.fmv{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fmv b{font-weight:700;font-size:15px}.fmv span{color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mealhead{gap:6px}
.mname{font-weight:600;font-size:15px}
.empty-meal .mname{color:var(--muted);font-weight:500}
.mk{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.addbtn{width:28px;height:28px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.addbtn svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round}
.mitems{padding-left:2px;margin-top:-4px}
.mitems .item{padding:9px 0;border-top:0}
.wtype{display:inline-flex;align-items:center;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pday{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pday:first-child{border-top:0}
button.pday{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font:inherit}
button.pday:first-child{border-top:0}
.pday.today{border-top-color:transparent}
button.pday.today{width:calc(100% + 20px)}
.plist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.plist li::marker{color:var(--accent)}
.pdetail{grid-column:2/-1;font-size:13.5px;color:var(--fg);background:var(--sunk);border-radius:12px;padding:10px 12px;line-height:1.5}
.pday.today{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:10px;border-top-color:transparent}
.pday .dn{text-align:center;line-height:1.1}
.pday .dn b{display:block;font-family:var(--f-display);font-size:22px}
.done{color:var(--good);font-weight:700;font-size:12.5px}
.mealhead{border:0;background:none;padding:0;display:flex;align-items:center;gap:8px;text-align:left;color:inherit;font:inherit;min-width:0;flex:1}
.mealhead:disabled{cursor:default}
.mealhead>span{display:flex;flex-direction:column;min-width:0}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600;flex:none}
.datebtn{border:0;background:none;padding:2px 4px;border-radius:8px;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.datebtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebtn svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.4;flex:none}
button.item{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font:inherit}
button.item:first-child{border-top:0}
.chev{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2.2;flex:none}
button.card{font:inherit;color:inherit;width:100%;text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.stats>div{min-width:0}
.stats .v{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stats .k{font-size:11.5px;color:var(--muted)}
.readout{position:sticky;top:0;z-index:2;background:var(--bg);padding-block:8px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.readout b{font-family:var(--f-display);font-size:18px}
.chartbox svg{touch-action:pan-y;cursor:crosshair}
.splits{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.splits th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px 6px}
.splits td{padding:7px 6px;border-top:1px solid var(--line)}
.splits .pbar{height:8px;border-radius:4px;background:var(--accent);opacity:.75}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="datebox">
      <button class="ghost" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1><button class="datebtn" id="dateBtn" aria-label="Change date or view"><span id="dateTitle">Today</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></h1>
      <button class="ghost" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view" class="stack"></main>
</div>

<div class="tabbar"><nav role="tablist">
  <button class="tab" role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Today</button>
  <button class="tab" role="tab" data-tab="food" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M17 2c-2 2-3 5-3 8h3v12"/></svg>Food</button>
  <button class="tab" role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Train</button>
  <button class="tab" role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button class="tab" role="tab" data-tab="body" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>Body</button>
</nav></div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
"use strict";
const STANDALONE = true; // true in the GitHub copy: data on this phone only, Open Food Facts instead of Claude, no Strava
/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = () => ymd(new Date());
const r0 = n => Math.round(n||0);
const r1 = n => Math.round((n||0)*10)/10;
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const KG_PER_LB = 0.45359237;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg){ const h=$("#toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2200); }
const icon = {
  run:'<svg viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="M6 20l3-6 3 2 2 5M9 14l1-5 4 1 3 3M10 9l-3 2"/></svg>',
  lift:'<svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>',
  walk:'<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-2-3 1-5 3 3 3 1M10 12l-3 3"/></svg>',
  other:'<svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- state ---------- */
const DEFAULT_SETTINGS = { unit:"lb", sex:"male", age:23, heightCm:178, goalRate:-1, proteinPerLb:1.0, fatPct:25, neat:1.25, kcalFloor:1600 };
const S = {
  date: TODAY(), tab: lsGet("tab") || "today",
  settings: {...DEFAULT_SETTINGS},
  days: {},            // date -> day doc
  foods: [],           // personal food library
  strava: [], stravaState: "loading", stravaMsg: "",
  routines: null, trainDate: ymd(new Date()), routineTab: "A", foodView: "day", runCache: {}, meals: [], zones: null, openMeals: new Set(), plan: null, planWeek: null, openLift: null, openSessions: new Set(), openPlanDay: null, openRoutines: new Set(),
  db:null, uidv:null, mcp:null, sample:null, sampleImages:false, ready:false
};
const blankDay = date => ({ date, food:[], weight:null, bodyFat:null, whoop:{}, garmin:{}, lifts:[] });
const day = (d=S.date) => S.days[d] || blankDay(d);

/* ---------- storage (db capability, with local fallback) ---------- */
let refs = null;
const queues = {};
function enqueue(key, fn){ queues[key] = (queues[key]||Promise.resolve()).then(fn).catch(e=>{ console.error(e); toast("Couldn't save. Check your connection."); }); return queues[key]; }
function saveDay(d){
  S.days[d.date] = d; render();
  if (refs) return enqueue("day:"+d.date, () => refs.days.doc(d.date).set(JSON.parse(JSON.stringify(d))));
  lsSet("local:days", S.days);
}
function saveSettings(){ render(); if (refs) return enqueue("settings", () => refs.settings.set({...S.settings})); lsSet("local:settings", S.settings); }
function saveMeals(){ render(); if (refs) return enqueue("meals", () => refs.meals.set({ items: S.meals.slice(0,100) })); lsSet("local:meals", S.meals); }
function saveFoods(){ if (refs) return enqueue("foods", () => refs.foods.set({ items: S.foods.slice(0,400) })); lsSet("local:foods", S.foods); }

async function boot(){
  render();
  const c = window.claude;
  if (!c || !c.use) { loadLocal(); S.stravaState="unavailable"; S.ready=true; render(); return; }
  const [db, user, mcp, sample] = await Promise.all([c.use("db"), c.use("user"), c.use("mcp"), c.use("sample")]);
  S.mcp = mcp; S.sample = sample;
  if (sample) { try { const lim = await sample.limits(); S.sampleImages = !!lim?.images; } catch {} }
  if (db && user) {
    try {
      S.uidv = await user.id(); S.db = db;
      const base = "data/users/"+S.uidv;
      refs = { settings: db.collection(base).doc("settings"), foods: db.collection(base).doc("foods"), days: db.collection(base+"/log/days"), routines: db.collection(base).doc("routines"), meals: db.collection(base).doc("meals"), plan: db.collection(base).doc("plan") };
      refs.plan.onSnapshot(s => { S.plan = s.exists? JSON.parse(JSON.stringify(s.data())) : null; render(); }, e=>console.warn(e));
      refs.meals.onSnapshot(s => { S.meals = s.exists? JSON.parse(JSON.stringify(s.data().items||[])) : []; render(); }, e=>console.warn(e));
      refs.routines.onSnapshot(s => { S.routines = s.exists? JSON.parse(JSON.stringify(s.data())) : null; render(); }, e=>console.warn(e));
      refs.settings.onSnapshot(s => { if (s.exists) { S.settings = {...DEFAULT_SETTINGS, ...s.data()}; render(); } }, e=>console.warn(e));
      refs.foods.onSnapshot(s => { if (s.exists) { S.foods = (s.data().items||[]).slice(); } render(); }, e=>console.warn(e));
      refs.days.orderBy("date","desc").limit(800).onSnapshot(snap => {
        const next = {}; snap.docs.forEach(d => { next[d.id] = JSON.parse(JSON.stringify(d.data())); });
        S.days = next; S.ready = true; render();
      }, e => { console.warn(e); S.ready = true; render(); });
    } catch(e){ console.warn(e); loadLocal(); }
  } else loadLocal();
  S.ready = true; render();
  loadStrava(false);
}
function loadLocal(){ S.days = lsGet("local:days")||{}; S.settings = {...DEFAULT_SETTINGS, ...(lsGet("local:settings")||{})}; S.foods = lsGet("local:foods")||[]; S.routines = lsGet("local:routines"); S.meals = lsGet("local:meals")||[]; S.plan = lsGet("local:plan"); }

/* ---------- Strava ---------- */
async function loadStrava(fresh, gesture){
  if (!S.mcp) { S.stravaState = "unavailable"; render(); return; }
  S.stravaState = S.strava.length ? "refreshing" : "loading"; render();
  const start = ymd(new Date(Date.now()-120*864e5))+"T00:00:00";
  try {
    const res = await S.mcp.callTool("Strava","list_activities",{ first:100, range_start:start }, { cache: { staleTime: fresh?0:10*60e3, gcTime: 7*864e5, refresh: !!fresh } });
    const p = res.payload || {};
    S.strava = (p.activities||[]).map(a => ({
      id:a.id, name:a.name, type:a.sport_type, start:a.start_local, date:(a.start_local||"").slice(0,10),
      km:(a.summary?.distance||0)/1000, sec:a.summary?.moving_time||0, kcal:a.summary?.total_calories||0,
      elev:a.summary?.elevation_gain||0, effort:a.summary?.relative_effort
    }));
    S.stravaState = "ok"; S.stravaAt = res.cache?.storedAt || Date.now();
  } catch(e){
    const code = e?.code;
    S.stravaState = "error";
    S.stravaMsg = stravaErr(e);
    S.stravaCode = code;
  }
  render();
}
function stravaErr(e){ const code=e?.code;
  return ({
      server_not_connected:"Strava isn't connected. Add it in claude.ai Settings → Connectors, then refresh.",
      needs_reauth:"Your Strava login expired. Reconnect Strava in claude.ai Settings → Connectors.",
      approval_required:"This page needs your OK to read Strava.",
      not_in_manifest:"Strava access is turned off for this page.",
      selection_required:"Choose which Strava connection to use when claude.ai asks, then refresh.",
      tool_error:"Strava returned an error: "+(e?.message||""),
      not_granted:"Live Strava data isn't available in this view.",
      capability_disabled:"Live Strava data isn't available in this view."
    })[code] || "Couldn't reach Strava just now. Try refresh in a minute.";
}
const isRun = a => /Run/i.test(a.type);
const isLift = a => /Weight|Strength|Crossfit|Workout/i.test(a.type);
function sportIcon(t){ return /Run/i.test(t)?icon.run : /Weight|Strength|Crossfit|Workout/i.test(t)?icon.lift : /Walk|Hike/i.test(t)?icon.walk : icon.other; }
function fmtDur(sec){ const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); return h? `${h}h ${String(m).padStart(2,"0")}m` : `${m} min`; }
function fmtPace(km, sec){ if(!km) return ""; const p=sec/km; return `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,"0")}/km`; }

/* ---------- body / nutrition maths ---------- */
const U = () => S.settings.unit;
const kgTo = kg => kg==null? null : (U()==="lb"? kg/KG_PER_LB : kg);
const toKg = v => v==null||v===""? null : (U()==="lb"? Number(v)*KG_PER_LB : Number(v));
function weightSeries(){
  return Object.values(S.days).filter(d=>d.weight).sort((a,b)=>a.date<b.date?-1:1).map(d=>({date:d.date, kg:d.weight}));
}
function trendSeries(){ // exponentially smoothed trend, alpha .1 per weigh-in
  const s = weightSeries(); let t=null;
  return s.map(p => { t = t==null? p.kg : t + 0.1*(p.kg - t); return {...p, trend:t}; });
}
function latestWeightKg(){ const s=weightSeries(); return s.length? s[s.length-1].kg : null; }
function trendNow(){ const t=trendSeries(); if(!t.length) return null;
  const last=t[t.length-1]; const cut=addDays(last.date,-14); const prev=[...t].reverse().find(p=>p.date<=cut);
  return { kg:last.trend, perWeekKg: prev? (last.trend-prev.trend)/((parseYmd(last.date)-parseYmd(prev.date))/(7*864e5)) : null };
}
function bmr(){ const st=S.settings; const w = latestWeightKg() || 75;
  return 10*w + 6.25*(st.heightCm||178) - 5*(st.age||23) + (st.sex==="female"?-161:5); }
function activitiesOn(date){ return S.strava.filter(a=>a.date===date); }
function targets(date=S.date){
  const d = day(date), st=S.settings;
  const exercise = activitiesOn(date).reduce((s,a)=>s+(a.kcal||0),0);
  const base = Math.round(bmr()*st.neat);
  const burn = base + exercise;
  const src = exercise? `${base.toLocaleString()} daily + ${r0(exercise)} from workouts` : "daily estimate, no workouts yet";
  const delta = (st.goalRate||0) * 3500/7;            // lb/week -> kcal/day
  let kcal = Math.round(burn + delta);
  const floored = kcal < st.kcalFloor; if (floored) kcal = st.kcalFloor;
  const lb = (latestWeightKg()||75)/KG_PER_LB;
  const protein = Math.round(lb * (st.proteinPerLb||1));
  const fat = Math.round(kcal*(st.fatPct||25)/100/9);
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  return { kcal, protein, carbs, fat, burn:Math.round(burn), src, floored, delta:Math.round(delta) };
}
function eaten(date=S.date){ return day(date).food.reduce((a,f)=>({kcal:a.kcal+f.kcal*f.qty, p:a.p+f.protein*f.qty, c:a.c+f.carbs*f.qty, f:a.f+f.fat*f.qty}),{kcal:0,p:0,c:0,f:0}); }
function weekKm(date=S.date){ const d=parseYmd(date); const dow=(d.getDay()+6)%7; const mon=addDays(date,-dow), sun=addDays(mon,6);
  return S.strava.filter(a=>isRun(a)&&a.date>=mon&&a.date<=sun).reduce((s,a)=>s+a.km,0); }
function recovColor(v){ return v==null? "var(--faint)" : v>=67? "var(--good)" : v>=34? "var(--warn)" : "var(--bad)"; }

/* ---------- render ---------- */
function render(){
  const wk = weekMode();
  const t = wk? (weekStart(S.date)===weekStart(TODAY())? "This week" : "Week of "+parseYmd(weekStart(S.date)).toLocaleDateString(undefined,{month:"short",day:"numeric"}))
    : S.date===TODAY()? "Today" : S.date===addDays(TODAY(),-1)? "Yesterday" : parseYmd(S.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  $("#dateTitle").textContent = t;
  const atEnd = wk? weekStart(S.date)>=weekStart(TODAY()) : S.date>=TODAY();
  $("#nextDay").disabled = atEnd; $("#nextDay").style.visibility = atEnd? "hidden":"visible";
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  const v = $("#view");
  if (S._animTab!==S.tab){ S._animTab=S.tab; v.classList.remove("anim"); void v.offsetWidth; v.classList.add("anim"); clearTimeout(S._at); S._at=setTimeout(()=>v.classList.remove("anim"),1500); }
  v.innerHTML = ({today:viewToday, food:viewFood, train:viewTrain, plan:viewPlan, body:viewBody})[S.tab]?.() ?? viewToday();
}

function ringSvg(frac, color, size=132, stroke=8){
  const r=(size-stroke)/2, c=2*Math.PI*r, f=Math.max(0,Math.min(1,frac));
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--sunk)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/></svg>`;
}
function macroRow(name, got, goal, color){
  return `<div class="macro"><span class="muted">${name}</span><div class="bar"><i style="width:${Math.min(100,goal?got/goal*100:0)}%;background:${color}"></i></div><span class="num" style="font-size:16px">${r0(got)}<span class="muted">/${goal}g</span></span></div>`;
}

function viewToday(){
  const d=day(), tg=targets(), e=eaten(), left=tg.kcal-e.kcal, w=d.whoop||{};
  const tr=trendNow(); const acts=activitiesOn(S.date);
  const over = left<0;

  return `
  ${planTodayBox()}
  <div class="card stack" style="gap:14px">
    <div class="hero">
      <div class="ring">${ringSvg(tg.kcal? e.kcal/tg.kcal:0, over?"var(--bad)":"var(--accent)")}
        <div class="center"><span class="num big" style="color:${over?"var(--bad)":"var(--fg)"}">${Math.abs(r0(left)).toLocaleString()}</span><span class="label" style="margin-top:4px">${over?"kcal over":"kcal left"}</span></div></div>
      <div class="stack" style="gap:9px;min-width:0">
        ${macroRow("Protein", e.p, tg.protein, "var(--protein)")}
        ${macroRow("Carbs", e.c, tg.carbs, "var(--carbs)")}
        ${macroRow("Fat", e.f, tg.fat, "var(--fat)")}
        <div class="small muted"><span class="num" style="font-size:15px;color:var(--fg)">${r0(e.kcal).toLocaleString()}</span> of ${tg.kcal.toLocaleString()} kcal eaten</div>
      </div>
    </div>
    <button class="btn block" data-act="addfood" data-meal="${defaultMeal()}">Log food</button>
  </div>
  ${STANDALONE? "" : `<div class="grid2">
    <button class="card stat" data-act="tab" data-tab="train" style="text-align:left">
      <div class="label">Training today</div>
      <div class="v num">${r0(acts.reduce((s,a)=>s+a.sec,0)/60)} <span style="font-size:16px" class="muted">min</span></div>
      <div class="s">${acts.length? `${acts.length} ${acts.length===1?"activity":"activities"} · ${r0(acts.reduce((s,a)=>s+(a.kcal||0),0))} kcal` : S.stravaState==="loading"? "Loading Strava…" : "Nothing from Strava yet"}</div>
    </button>
    <button class="card stat" data-act="tab" data-tab="train" style="text-align:left">
      <div class="label">Run this week</div>
      <div class="v num">${r1(weekKm())} <span style="font-size:16px" class="muted">km</span></div>
      <div class="s">${S.stravaState==="ok"||S.stravaState==="refreshing"? `${S.strava.filter(a=>isRun(a)&&a.date>=addDays(S.date,-((parseYmd(S.date).getDay()+6)%7))&&a.date<=S.date).length} runs so far` : S.stravaState==="loading"? "Loading Strava…" : "Strava not loaded"}</div>
    </button>
  </div>`}
  ${acts.length? `<div class="card"><div class="label" style="margin-bottom:4px">Activity</div><div class="list">
    ${acts.map(actItem).join("")}
  </div></div>`:""}
  `;
}
function actItem(a){
  const sub = isRun(a)||a.km>0.2 ? `${r1(a.km)} km · ${fmtDur(a.sec)}${isRun(a)?" · "+fmtPace(a.km,a.sec):""}` : fmtDur(a.sec);
  const inner = `<span class="sport">${sportIcon(a.type)}</span><div class="main"><div class="t">${esc(a.name)}</div><div class="sub">${sub}</div></div><span class="kc">${a.kcal?r0(a.kcal):""}<span class="pf"> ${a.kcal?"kcal":""}</span></span>`;
  return isRun(a)? `<button class="item" data-act="run" data-id="${esc(a.id)}">${inner}<svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>` : `<div class="item">${inner}</div>`;
}
function defaultMeal(){ const h=new Date().getHours(); return h<11?"Breakfast":h<15?"Lunch":h<21?"Dinner":"Snack 1"; }

/* Food tab */
const MEALS=["Pre-workout","Post-workout","Breakfast","Lunch","Dinner","Snack 1","Snack 2"];
const mealOf = f => f.meal==="Snacks"? "Snack 1" : f.meal;
function weekStart(dt){ const d=parseYmd(dt); return addDays(dt,-((d.getDay()+6)%7)); }
function weekMode(){ return S.tab==="food" && S.foodView==="week"; }
function viewFoodWeek(){
  const mon=weekStart(S.date), now=TODAY();
  const rows=[0,1,2,3,4,5,6].map(i=>{ const dt=addDays(mon,i); const future=dt>now; const e=eaten(dt), tg=targets(dt); const logged=day(dt).food.length>0;
    return {dt,future,e,tg,logged, def: logged&&!future? tg.burn-e.kcal : null, vsT: logged&&!future? tg.kcal-e.kcal : null}; });
  const L=rows.filter(r=>r.def!=null);
  const totDef=L.reduce((s,r)=>s+r.def,0), totT=L.reduce((s,r)=>s+r.vsT,0);
  const avg=k=>L.length? L.reduce((s,r)=>s+r.e[k],0)/L.length : 0;
  const W=340,H=170,pl=6,pr=6,pt=18,pb=20, slot=(W-pl-pr)/7;
  const maxY=Math.max(1000,...rows.map(r=>Math.max(r.e.kcal, r.future?0:r.tg.kcal)))*1.12;
  const Y=v=>pt+(1-v/maxY)*(H-pt-pb);
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories eaten each day this week against target">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    ${rows.map((r,i)=>{ const x=pl+i*slot, bw=slot*.56, bx=x+(slot-bw)/2; const over=r.e.kcal>r.tg.kcal;
      const bar = r.e.kcal>0? `<rect x="${bx}" y="${Y(r.e.kcal)}" width="${bw}" height="${H-pb-Y(r.e.kcal)}" rx="4" fill="${over?"var(--bad)":"var(--accent)"}" opacity="${r.dt===now?.6:1}"/><text x="${x+slot/2}" y="${Y(r.e.kcal)-5}" text-anchor="middle">${(r.e.kcal/1000).toFixed(1)}k</text>` : "";
      const tgt = r.future? "" : `<line x1="${bx-4}" x2="${bx+bw+4}" y1="${Y(r.tg.kcal)}" y2="${Y(r.tg.kcal)}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="3 2"/>`;
      return `<g data-act="gofoodday" data-d="${r.dt}" style="cursor:pointer"><rect x="${x}" y="0" width="${slot}" height="${H}" fill="transparent"/>${bar}${tgt}<text x="${x+slot/2}" y="${H-5}" text-anchor="middle" style="${r.dt===S.date?"font-weight:700":""}">${parseYmd(r.dt).toLocaleDateString(undefined,{weekday:"narrow"})}</text></g>`; }).join("")}
  </svg>`;
  return `
  <div class="card stack" style="gap:6px">
    <div class="label">${totDef>=0?"Weekly deficit":"Weekly surplus"}</div>
    <div class="num" style="font-size:33px;font-weight:700;line-height:1;color:${L.length?(totDef>=0?"var(--good)":"var(--bad)"):"var(--fg)"}">${L.length? Math.abs(r0(totDef)).toLocaleString() : "–"} <span class="muted" style="font-size:16px">kcal</span></div>
    <div class="small muted">${L.length? `About ${Math.abs(r1(totDef/3500))} lb ${totDef>=0?"of fat lost":"gained"} over ${L.length} logged ${L.length===1?"day":"days"} · ${totT>=0? r0(totT).toLocaleString()+" kcal under":Math.abs(r0(totT)).toLocaleString()+" kcal over"} your targets` : "Log food this week to see your deficit."}</div>
  </div>
  <div class="card stack" style="gap:8px">
    <div class="row between"><h2>Calories</h2><span class="pf"><span style="display:inline-block;width:14px;border-top:2px dashed var(--fg);vertical-align:3px"></span> target</span></div>
    ${chart}
    <div class="row small" style="gap:14px;flex-wrap:wrap"><span class="muted">Daily average</span><span><b class="num" style="font-size:16px">${r0(avg("kcal")).toLocaleString()}</b> kcal</span><span>P ${r0(avg("p"))}g</span><span>C ${r0(avg("c"))}g</span><span>F ${r0(avg("f"))}g</span></div>
  </div>
  <div class="card"><div class="list">
    ${rows.filter(r=>!r.future).reverse().map(r=>`<button class="item" data-act="gofoodday" data-d="${r.dt}"><div class="main"><div class="t">${r.dt===now?"Today":parseYmd(r.dt).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</div><div class="sub">${r.logged? `${r0(r.e.kcal).toLocaleString()} eaten · ${r.tg.burn.toLocaleString()} burned` : "Not logged"}</div></div>${r.def!=null?`<span class="num" style="font-size:18px;font-weight:600;color:${r.def>=0?"var(--good)":"var(--bad)"}">${r.def>=0?"−":"+"}${Math.abs(r0(r.def)).toLocaleString()}</span>`:""}<svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>`).join("")}
  </div><div class="pf" style="margin-top:6px">Deficit is calories burned minus calories eaten. Burn is your estimated daily burn plus calories from Strava workouts.</div></div>`;
}
function viewFood(){
  if (S.foodView==="week") return viewFoodWeek();
  const d=day(), tg=targets(), e=eaten(); const left=tg.kcal-e.kcal, over=left<0;

/* Strength sessions from Whoop screenshots */
function setsSummary(sets){ const out=[]; sets.forEach(st=>{ const key=`${st.reps??""}|${st.load??""}`; const last=out[out.length-1]; if(last&&last.key===key) last.n++; else out.push({key,n:1,reps:st.reps,load:st.load}); });
  return out.map(g=>`${g.n} × ${g.reps??"–"}${g.load?` · ${g.load}`:""}`).join(", "); }
function niceEx(name){ const parts=String(name).split(/\s+-\s+/).map(x=>x.trim()).filter(Boolean); return parts.length>1? [...parts.slice(1).reverse(), parts[0]].join(" ") : String(name); }
function loadNum(l){ const v=parseFloat(String(l??"").replace(/[^\d.]/g,"")); return isNaN(v)? null : v; }
function loadUnit(l){ const m=String(l??"").match(/[a-z]+/i); return m? m[0] : ""; }
const isAssisted = n => /assist/i.test(n);
function topSet(name, sets){
  const w=sets.filter(st=>loadNum(st.load)!=null);
  if(!w.length) return sets.reduce((b,st)=>(Number(st.reps)||0)>(Number(b?.reps)||0)?st:b, null);
  const inv=isAssisted(name);
  return w.reduce((b,st)=>{ if(!b) return st; const a=loadNum(st.load), c=loadNum(b.load); if(inv? a<c : a>c) return st; if(a===c && (Number(st.reps)||0)>(Number(b.reps)||0)) return st; return b; }, null);
}
function workingSets(name, sets){

  const mx=Math.max(...sets.map(st=>loadNum(st.load)||0)); const tol=0.15*Math.max(mx,1);
  return sets.filter(st=>{ const v=loadNum(st.load); return v!=null && Math.abs(v-tl)<=tol; });
}
function fmtSet(st){ if(!st) return "–"; const ld=loadNum(st.load); return ld!=null? `${ld} ${loadUnit(st.load)} × ${st.reps??"–"}` : `${st.reps??"–"}${typeof st.reps==="number"?" reps":""}`; }
function liftsBlock(td){
  const lifts=day(td).lifts||[];

    return `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <div class="row between"><button class="mealhead" data-act="togglelift" data-id="${l.id}" aria-expanded="${S.openSessions.has(l.id)}" style="gap:10px"><span class="sport">${icon.lift}</span><span><span style="font-weight:600">${esc(l.name)}</span><span class="pf">${l.exercises.length} exercises · ${work} working sets</span></span><svg class="chev" viewBox="0 0 24 24" style="transform:rotate(${S.openSessions.has(l.id)?90:0}deg)"><path d="M9 18l6-6-6-6"/></svg></button>

    </div>`; }).join("")}
    ${S.sampleImages? `<label class="btn sm sec block" for="liftShot" style="display:block;text-align:center;cursor:pointer;margin-top:10px">Add strength session from Whoop screenshot</label><input id="liftShot" type="file" accept="image/*" multiple hidden>`

function routineSessions(routine){ return Object.values(S.days).flatMap(d=>(d.lifts||[]).filter(l=>(l.name||"").toLowerCase()===routine.toLowerCase()).map(l=>({...l,date:d.date}))).sort((a,b)=>a.date<b.date?1:-1); }
function routineRow(routine){

}
function strengthHistoryHTML(routine){
  const sessions=Object.values(S.days).flatMap(d=>(d.lifts||[]).filter(l=>(l.name||"").toLowerCase()===routine.toLowerCase()).map(l=>({...l,date:d.date}))).sort((a,b)=>a.date<b.date?1:-1);
  if(!sessions.length) return `<div class="empty">No ${esc(routine)} sessions yet. Add one from a Whoop screenshot in the day view above, and choose ${esc(routine)} when saving.</div>`;
  const map=new Map(); // key -> {name, hist:[{date, top, n}]}
  sessions.forEach(se=>se.exercises.forEach((x,i)=>{ const k=niceEx(x.name).toLowerCase(); if(!map.has(k)) map.set(k,{name:niceEx(x.name), raw:x.name, order:i, hist:[]});
    map.get(k).hist.push({date:se.date, top:topSet(x.name,x.sets), n:workingSets(x.name,x.sets).length}); }));
  const lifts=[...map.values()].sort((a,b)=>a.order-b.order);
  return `<div class="list" style="background:var(--sunk);border-radius:14px;padding:2px 12px">${lifts.map(lf=>{ const last=lf.hist[0], prev=lf.hist[1]; const open=S.openLift===lf.name;
    const a=loadNum(last.top?.load), b=loadNum(prev?.top?.load); const inv=isAssisted(lf.raw);
    const delta = a!=null&&b!=null&&a!==b ? ((inv? b>a : a>b)? `<span style="color:var(--good);font-weight:700">▲</span>` : `<span style="color:var(--bad);font-weight:700">▼</span>`) : "";
    const series=lf.hist.slice().reverse().map(h=>loadNum(h.top?.load)).filter(v=>v!=null);
    return `<button class="item" data-act="lifthist" data-n="${esc(lf.name)}"><div class="main"><div class="t">${esc(lf.name)}</div><div class="sub">${lf.hist.length} ${lf.hist.length===1?"session":"sessions"}</div></div>
      ${series.length>1? spark(inv? series.map(v=>-v) : series) : ""}<span class="num" style="font-size:18px;font-weight:600;white-space:nowrap">${delta} ${esc(fmtSet(last.top))}</span>
      <svg class="chev" viewBox="0 0 24 24" style="transform:rotate(${open?90:0}deg)"><path d="M9 18l6-6-6-6"/></svg></button>
      ${open? `<div style="padding:0 0 10px 0"><table class="splits"><thead><tr><th>Date</th><th>Top set</th><th>Sets</th></tr></thead><tbody>${lf.hist.map(h=>`<tr><td>${parseYmd(h.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</td><td><b>${esc(fmtSet(h.top))}</b></td><td>${h.n}</td></tr>`).join("")}</tbody></table></div>`:""}`; }).join("")}</div>
  <div class="pf">Top set = heaviest set${lifts.some(l=>isAssisted(l.raw))?" (least assistance for assisted lifts)":""}. Warm-up sets are left out.</div>`;

function spark(vals){ const w=56,h=22,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-2-(v-mn)/rg*(h-4)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex:none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/></svg>`; }

const fmtPaceS = s => s==null||!isFinite(s)? "–" : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
function smooth(arr, w=5){ return arr.map((v,i)=>{ if(v==null) return null; let s=0,n=0; for(let j=Math.max(0,i-w);j<=Math.min(arr.length-1,i+w);j++){ if(arr[j]!=null){s+=arr[j];n++;} } return s/n; }); }
function pctl(a,q){ const b=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y); if(!b.length) return 0; return b[Math.min(b.length-1,Math.max(0,Math.floor(q*(b.length-1))))]; }
function lineChart(key, xs, ys, o){
  const W=340,H=120,pl=36,pr=6,pt=8,pb=16, xmax=xs[xs.length-1]||1;
  let mn=o.clip? pctl(ys,.03) : pctl(ys,0), mx=o.clip? pctl(ys,.97) : pctl(ys,1);
  if (mx-mn<(o.minRange||1)) { const c=(mx+mn)/2; mn=c-(o.minRange||1)/2; mx=c+(o.minRange||1)/2; }
  const pad=(mx-mn)*.08; mn-=pad; mx+=pad;
  const X=x=>pl+x/xmax*(W-pl-pr); const Y=v=>{ const f=(Math.min(mx,Math.max(mn,v))-mn)/(mx-mn); return pt+(o.invert? f : 1-f)*(H-pt-pb); };
  let d="", open=false, first=null, last=null;
  ys.forEach((v,i)=>{ if(v==null){ open=false; return; } const px=X(xs[i]).toFixed(1), py=Y(v).toFixed(1); d+=(open?"L":"M")+px+","+py; open=true; if(first==null) first=px; last=px; });
  const base=(H-pb).toFixed(1);
  const area = d && !d.slice(1).includes("M") ? `<path d="${d}L${last},${base}L${first},${base}Z" fill="${o.color}" opacity=".12"/>` : "";
  const ticks=[0.2,0.5,0.8].map(f=>mn+(mx-mn)*(o.invert?f:1-f));

function weightChart(pts){
  const W=340,H=150,pl=30,pr=8,pt=10,pb=18; const ys=pts.flatMap(p=>[kgTo(p.kg),kgTo(p.trend)]);
  let mn=Math.min(...ys),mx=Math.max(...ys); const pad=Math.max(.5,(mx-mn)*.12); mn-=pad; mx+=pad;
  const t0=parseYmd(pts[0].date).getTime(), t1=parseYmd(pts[pts.length-1].date).getTime()||t0+1;
  const X=dt=>pl+(parseYmd(dt).getTime()-t0)/Math.max(1,t1-t0)*(W-pl-pr), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const ticks=[mn+ (mx-mn)*.15, (mn+mx)/2, mx-(mx-mn)*.15];
  const line=pts.map(p=>`${X(p.date).toFixed(1)},${Y(kgTo(p.trend)).toFixed(1)}`).join(" ");
  const area=`${pl},${H-pb} ${line} ${X(pts[pts.length-1].date).toFixed(1)},${H-pb}`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${r1(v)}</text>`).join("")}
    <polygon points="${area}" fill="var(--accent)" opacity=".08"/>
    ${pts.map(p=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(kgTo(p.kg)).toFixed(1)}" r="2.2" fill="var(--faint)"/>`).join("")}
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.date)}" cy="${Y(kgTo(last.trend))}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H-4}">${parseYmd(pts[0].date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>
    <text x="${W-pr}" y="${H-4}" text-anchor="end">${parseYmd(last.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>
  </svg>`;
}

function gramInfo(f){ if(+f.grams>0) return {base:+f.grams, unit: f.gramUnit==="ml"?"ml":"g"};
  const m=String(f.serving||"").match(/(\d+(?:\.\d+)?)\s*(g|ml)\b/i); return m && Number(m[1])>0 ? {base:Number(m[1]), unit:m[2].toLowerCase()} : null; }
function parsePortion(serving){ const g=gramInfo({serving}); if(g) return g;
  const m=String(serving||"").match(/^\s*(\d+(?:\.\d+)?)\s*(.*)$/); if(!m) return null; const base=Number(m[1]); if(!(base>0)) return null; return {base, unit:m[2].trim()}; }
/* A food's macros are per one "unit" (its serving). grams = weight of one unit when known.
   Logged entries keep qty in units plus the mode the person chose: "count" or "g". */
function unitInfo(f){
  const g = gramInfo(f);
  const sv = String(f.serving||"").trim();
  const pureWeight = /^\s*\d+(?:\.\d+)?\s*(g|ml)\s*$/i.test(sv);
  let label = f.unit ? String(f.unit) : sv.replace(/\s*\([^)]*\)\s*/g," ").trim();
  let one = false;
  if (f.unit) one = true;
  else if (/^1\s+\S/.test(label) && !/^1\s*\//.test(label)) { label = label.replace(/^1\s+/,""); one = true; }
  if (!label || pureWeight) { label = "serving"; one = true; }
  return { grams: g? g.base : null, gunit: g? g.unit : "g", label, one, natural: !pureWeight && !/^serving$/i.test(label) };
}
function defaultMode(f){ const u=unitInfo(f); if(!u.grams) return "count"; if(f.mode) return f.mode; if(f.pref) return f.pref; if(/\(\s*\d+(?:\.\d+)?\s*(g|ml)\s*\)/i.test(f.serving||"")) return "g"; return u.natural? "count" : "g"; }
function countText(q, u){ const n=r1(q); if(u.one){ const pl = n!==1 && !/s$/i.test(u.label) && /^[a-z ]+$/i.test(u.label) && !/^(serving)$/i.test(u.label) ? u.label+"s" : (n!==1&&/^serving$/i.test(u.label)? "servings" : u.label); return `${n} ${pl}`; } return `${n} × ${u.label}`; }
function portionLabel(f){ const u=unitInfo(f); const mode=defaultMode(f); if(mode==="g" && u.grams) return `${r0(u.grams*f.qty)} ${u.gunit}`; return countText(f.qty, u); }
function amountHTML(key, f, mode, qty){
  const u=unitInfo(f); const val = mode==="g"&&u.grams ? r0(u.grams*qty) : r1(qty);
  return `<div class="amt" data-amt="${key}">
    ${u.grams? `<div class="seg mini" role="group" aria-label="Measure by"><button type="button" data-mode="count" aria-pressed="${mode!=="g"}">${esc(u.one? u.label : "servings")}</button><button type="button" data-mode="g" aria-pressed="${mode==="g"}">${u.gunit}</button></div>` : `<span class="small muted">${esc(u.one? u.label+"s" : "servings")}</span>`}
    <input type="number" inputmode="decimal" min="0" step="any" value="${val}" aria-label="Amount">
    <span class="pf" data-out></span></div>`;
}
/* wire one amount control; returns () => {qty, mode} */
function wireAmount(root, key, f, mode){
  const el=root.querySelector(`[data-amt="${key}"]`); const u=unitInfo(f); const inp=el.querySelector("input"); const out=el.querySelector("[data-out]");
  let m=mode;
  const qty=()=>{ const v=Math.max(0,Number(inp.value)||0); return m==="g"&&u.grams? v/u.grams : v; };
  const upd=()=>{ const q=qty(); out.textContent=`${r0(f.kcal*q)} kcal · P${r0(f.protein*q)} C${r0(f.carbs*q)} F${r0(f.fat*q)}`; };
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ if(b.dataset.mode===m) return; const q=qty(); m=b.dataset.mode;
    el.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    inp.value = m==="g"? r0(q*u.grams) : (q? r1(q) : 1); upd(); });
  inp.oninput=upd; upd();
  return ()=>({qty:qty(), mode:m});
}

function mealTotals(ml){ return ml.items.reduce((a,x)=>({kcal:a.kcal+x.kcal*x.qty,p:a.p+x.protein*x.qty,c:a.c+x.carbs*x.qty,f:a.f+x.fat*x.qty}),{kcal:0,p:0,c:0,f:0}); }
function addMealItems(ml, meal){
  const d=structuredClone(day());

function offToFood(p){

const OFF_FIELDS="code,product_name,generic_name,brands,nutriments,serving_size,serving_quantity";
async function offLookup(q){
  const m=q.match(/^\s*(\d+(?:\.\d+)?)\s+(.+)$/); const count=m? Number(m[1]) : null; const term=(m? m[2] : q).trim().toLowerCase();
  const words=term.replace(/s\b/g,"").split(/\s+/).filter(Boolean);
  const common=COMMON_FOODS.filter(f=>words.every(w=>f.name.toLowerCase().includes(w))).map(f=>({...f, count: count&&f.unit? count : undefined}));
  let off=[];
  try { const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=15&fields=${OFF_FIELDS}`);
    if(r.ok){ const j=await r.json(); off=(j.products||[]).map(offToFood).filter(Boolean).slice(0,10); } }
  catch(e){ if(!common.length) throw e; }
  return { items:[...common, ...off] };
}
async function offBarcode(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`); if(!r.ok) return null;
  const j=await r.json(); if(j.status!==1 || !j.product) return null; const f=offToFood({...j.product, code}); return f? {...f, barcode:code} : null;

      <div class="label" style="margin-top:4px">Your data</div>
      <div class="small muted">${STANDALONE? "This version saves everything on this phone only. Copy a backup now and then, and paste data copied from the Claude version to bring your logs over." : "Copy all your logs to paste into the phone version (or keep as a backup)."}</div>
      <div class="row" style="gap:8px"><button type="button" class="btn sec sm" data-export style="flex:1">Copy all data</button><button type="button" class="btn sec sm" data-import style="flex:1">Paste data…</button></div>
      <div id="impBox" hidden class="stack" style="gap:8px"><textarea id="impText" rows="4" placeholder="Paste copied data here" style="width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;font-size:12px;resize:vertical"></textarea><button type="button" class="btn sm" data-doimport>Bring in this data</button></div>
      <div class="note">Target = your estimated daily burn + Strava workout calories, ${st.goalRate<0?"minus":"plus"} your goal ${st.goalRate<0?"deficit":"surplus"}. Protein is set from your trend weight, fat from the percentage, carbs fill the rest.</div>
      <button class="btn" type="submit">Save</button>
    </form>`, sh => {
      sh.querySelector("[data-close]").onclick = closeSheet;
      let unit = st.unit;
      sh.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ unit=b.dataset.u; sh.querySelectorAll("[data-u]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
      sh.querySelector("[data-export]").onclick = async ev => { const txt=JSON.stringify(exportData()); const b=ev.currentTarget;
        try { await navigator.clipboard.writeText(txt); b.textContent="Copied ✓"; toast("All data copied"); }
        catch { const box=sh.querySelector("#impBox"); box.hidden=false; const ta=sh.querySelector("#impText"); ta.value=txt; ta.focus(); ta.select(); toast("Select all and copy the text"); } };
      sh.querySelector("[data-import]").onclick = () => { const box=sh.querySelector("#impBox"); box.hidden=!box.hidden; if(!box.hidden){ sh.querySelector("#impText").value=""; sh.querySelector("#impText").focus(); } };
      sh.querySelector("[data-doimport]").onclick = async ev => { let d; try{ d=JSON.parse(sh.querySelector("#impText").value); }catch{ toast("That doesn't look like copied dashboard data"); return; }
        if(!d||d.app!=="paya-hub"){ toast("That doesn't look like copied dashboard data"); return; }
        ev.currentTarget.disabled=true; ev.currentTarget.textContent="Bringing in…"; const n=await importData(d); closeSheet(); toast(`Brought in ${n} days of logs`); };
      sh.querySelector("#stf").onsubmit = ev => { ev.preventDefault(); const g=id=>sh.querySelector(id).value;
        S.settings = {...st, unit, goalRate:Number(g("#s_goal")), proteinPerLb:Number(g("#s_pro"))||1, fatPct:Number(g("#s_fat"))||25, kcalFloor:Number(g("#s_floor"))||1500, sex:g("#s_sex"), age:Number(g("#s_age"))||23, heightCm:Number(g("#s_h"))||178, neat:Number(g("#s_neat"))};
        saveSettings(); closeSheet(); toast("Settings saved"); };
    });
}

/* CSV import */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=""; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=c; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function toDateKey(s){ if(!s) return null; s=s.trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  const d=new Date(s); return isNaN(d)? null : ymd(d); }
async function importCSV(file){
  const status = $("#importStatus"); status.innerHTML = `<span class="spin"></span> Reading ${esc(file.name)}…`;
  const rows = parseCSV(await file.text()); if(rows.length<2){ status.textContent="That file has no rows."; return; }
  const H = rows[0].map(h=>h.trim().toLowerCase()); const col = re => H.findIndex(h=>re.test(h));
  const dateI = [col(/cycle start/), col(/^date/), col(/time of measurement/), col(/date|time/)].find(i=>i>=0);
  if (dateI==null){ status.textContent="Couldn't find a date column in that file."; return; }
  const iRec=col(/recovery score/), iHrv=col(/heart rate variability|hrv/), iRhr=col(/resting heart rate/), iSlp=col(/asleep duration/), iSp=col(/sleep performance/), iStr=col(/day strain/);
  const iWkg=col(/weight.*kg/), iWlb=col(/weight.*lb/), iW=col(/^weight/), iBf=col(/body fat/), iKc=col(/total calories|^calories/), iSteps=col(/steps/);
  const kind = (iWkg>=0||iWlb>=0||iW>=0)? "scale" : (iKc>=0||iSteps>=0)? "Garmin" : null;
  if(!kind){ status.textContent="Didn't recognize this file. Use a Renpho export or a Garmin daily summary."; return; }
  const numAt=(r,i)=>{ if(i<0) return null; const v=parseFloat(String(r[i]).replace(/[^\d.\-]/g,"")); return isNaN(v)? null : v; };
  const changes = {};
  for (const r of rows.slice(1)){ const dk=toDateKey(r[dateI]); if(!dk) continue;
    const d = changes[dk] || structuredClone(S.days[dk] || blankDay(dk));
    if (kind==="Whoop"){ const sl=numAt(r,iSlp);
      d.whoop = {...d.whoop, recovery:numAt(r,iRec)??d.whoop.recovery, hrv:numAt(r,iHrv)??d.whoop.hrv, rhr:numAt(r,iRhr)??d.whoop.rhr, sleepH: sl!=null? r1(sl/60):d.whoop.sleepH, sleepPerf:numAt(r,iSp)??d.whoop.sleepPerf, strain:numAt(r,iStr)??d.whoop.strain}; }
    else if (kind==="scale"){ const gw = numAt(r,iW); let kg = iWkg>=0? numAt(r,iWkg) : iWlb>=0? (numAt(r,iWlb)??0)*KG_PER_LB : (gw!=null? (U()==="lb"? gw*KG_PER_LB : gw) : null);
      if(kg){ d.weight = Math.round(kg*100)/100; } const bf=numAt(r,iBf); if(bf!=null) d.bodyFat=bf; }
    else { const kc=numAt(r,iKc), st=numAt(r,iSteps); d.garmin={...d.garmin, kcal:kc??d.garmin.kcal, steps:st??d.garmin.steps}; }
    changes[dk]=d; }
  const list = Object.values(changes); let n=0;
  for (const d of list){ S.days[d.date]=d; if(refs){ await refs.days.doc(d.date).set(JSON.parse(JSON.stringify(d))).catch(()=>{}); } n++; if(n%10===0) status.innerHTML=`<span class="spin"></span> Saving ${n} of ${list.length} days…`; }
  if(!refs) lsSet("local:days", S.days);
  render(); const st=$("#importStatus"); if(st) st.textContent = `Imported ${list.length} days of ${kind} data.`; toast(`Imported ${list.length} days`);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab].tab"); if(!t) return;
  if (t.classList.contains("tab")){ S.tab=t.dataset.tab; lsSet("tab",S.tab); render(); window.scrollTo(0,0); return; }
  const a=t.dataset.act;
  if (a==="tab"){ S.tab=t.dataset.tab; lsSet("tab",S.tab); render(); window.scrollTo(0,0); }
  else if (a==="addfood") addFoodSheet(t.dataset.meal||defaultMeal());
  else if (a==="delfood"){ const nd=structuredClone(day()); nd.food=nd.food.filter(f=>f.id!==t.dataset.id); saveDay(nd); }
  else if (a==="togglemeal"){ const m=t.dataset.meal; S.openMeals.has(m)? S.openMeals.delete(m) : S.openMeals.add(m); render(); }
  else if (a==="editfood") editFoodSheet(t.dataset.id);
  else if (a==="metrics" || a==="shot") metricsSheet();
  else if (a==="weighin") weighInSheet(t.dataset.d);
  else if (a==="tday"){ const nd=addDays(S.trainDate, +t.dataset.n); if(nd<=TODAY()){ S.trainDate=nd; render(); } }
  else if (a==="toggleweighins"){ S.openWeighins=!S.openWeighins; render(); }
  else if (a==="toggleroutine"){ const r=t.dataset.r; S.openRoutines.has(r)? S.openRoutines.delete(r) : S.openRoutines.add(r); render(); }
  else if (a==="planday"){ S.openPlanDay = S.openPlanDay===t.dataset.d? null : t.dataset.d; render(); }
  else if (a==="pweek"){ S.planWeek=(S.planWeek||1)+Number(t.dataset.n); render(); window.scrollTo(0,0); }
  else if (a==="togglelift"){ const id=t.dataset.id; S.openSessions.has(id)? S.openSessions.delete(id) : S.openSessions.add(id); render(); }
  else if (a==="lifthist"){ S.openLift = S.openLift===t.dataset.n? null : t.dataset.n; render(); }
  else if (a==="rtab"){ S.routineTab=t.dataset.k; render(); }
  else if (a==="savemeal") saveMealSheet(t.dataset.meal);
  else if (a==="movemeal") moveMealSheet(t.dataset.meal);
  else if (a==="copyfrom") copyFromSheet();
  else if (a==="dellift"){ if(t.dataset.armed){ const nd=structuredClone(day(S.trainDate)); nd.lifts=(nd.lifts||[]).filter(l=>l.id!==t.dataset.id); saveDay(nd); toast("Session removed"); } else { t.dataset.armed="1"; t.innerHTML='<span class="small" style="color:var(--bad);font-weight:600">Remove?</span>'; } }
  else if (a==="range"){ bodyRange=+t.dataset.n; render(); }
  else if (a==="strava-refresh") loadStrava(true);
  else if (a==="runs") runsSheet(0);
  else if (a==="run") runDetail(t.dataset.id);
  else if (a==="gofoodday"){ S.date=t.dataset.d; S.foodView="day"; render(); window.scrollTo(0,0); }
  else if (a==="strava-allow") loadStrava(true, true);
});
let swipe=null;
document.addEventListener("touchstart", e => { const c=e.target.closest("#dayCard"); swipe = c? {x:e.touches[0].clientX, y:e.touches[0].clientY} : null; }, {passive:true});
document.addEventListener("touchend", e => { if(!swipe) return; const t=e.changedTouches[0]; const dx=t.clientX-swipe.x, dy=t.clientY-swipe.y; swipe=null;
  if (Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.5) return;
  const nd = addDays(S.trainDate, dx>0? -1 : 1); if (nd<=TODAY()){ S.trainDate=nd; render(); } }, {passive:true});
document.addEventListener("change", e => { if (e.target.id==="csvIn" && e.target.files[0]) importCSV(e.target.files[0]);
  if (e.target.id==="liftShot" && e.target.files.length) importLiftShot([...e.target.files].slice(0,4)); });
$("#prevDay").onclick = () => { S.date=addDays(S.date, weekMode()? -7 : -1); render(); };
$("#nextDay").onclick = () => { const n=addDays(S.date, weekMode()? 7 : 1); if(weekMode()? weekStart(n)<=weekStart(TODAY()) : n<=TODAY()){ S.date = n>TODAY()? TODAY() : n; render(); } };
$("#dateBtn").onclick = dateSheet;
$("#openSettings").onclick = settingsSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && S.date!==TODAY() && S._lastToday && S._lastToday!==TODAY()) { S.date=TODAY(); render(); } S._lastToday=TODAY(); });
S._lastToday = TODAY();

boot();
})();
